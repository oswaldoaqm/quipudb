name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core:
    name: Compilar core (C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configurar
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compilar
        run: cmake --build build --parallel
      - name: Ejecutar pruebas
        # Sin el --no-tests=error, un ctest que no encuentra ninguna prueba
        # registrada sale con 0 y el job pasa en verde sin haber probado nada.
        run: ctest --test-dir build --output-on-failure --no-tests=error

  python:
    name: Lint capa Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install ruff pytest
      - run: ruff check engine benchmarks
      - run: python -m pytest -q

  commits:
    name: Validar mensajes de commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Traer la rama base
        run: git fetch --no-tags origin "${{ github.base_ref }}"
      - name: Revisar formato del historial del PR
        run: bash .github/scripts/check-commits.sh FETCH_HEAD HEAD
