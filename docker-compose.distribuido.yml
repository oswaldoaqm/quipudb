# QuipuDB distribuido en Docker: dos nodos y el coordinador (#280).
# Desde la raiz del repo:
#
#   docker compose -f docker-compose.distribuido.yml up -d --build
#   curl http://localhost:8010/health
#   cd frontend && npm run dev:distribuido      # http://localhost:5176
#
# El coordinador queda en http://localhost:8010 y los nodos en 8011 y 8012.
# Son puertos propios para que el distribuido corra a la vez que el motor de
# docker-compose.yml (8000) y que Quipucamayoc y Rikuq (8001 a 8004, 5174 y
# 5175). La tabla completa esta en docs/puertos.md.
#
# El catalogo de arranque es docs/ejemplos/catalogo-distribuido-v1.json: items con
# id < 10000 en n1 e id >= 10000 en n2. Las tablas que se creen despues por SQL
# quedan en los volumenes; "down -v" vuelve al catalogo de arranque. Dentro de
# la red de Docker los nodos se llaman n1 y n2 y escuchan en el 8000, que es lo
# que dice ese catalogo; afuera se publican en otros puertos.

x-quipudb: &quipudb
  build: .
  image: quipudb:local
  volumes:
    - ./docs/ejemplos/catalogo-distribuido-v1.json:/app/catalogo.json:ro

services:
  n1:
    <<: *quipudb
    # Prepara el directorio la primera vez; despues solo arranca el nodo.
    command: >
      sh -c "python -m scripts.preparar_nodo --catalog catalogo.json --catalog-version 1
      --node-id n1 --data-dir /app/datos/n1
      && exec python -m engine.distributed.node_server --catalog catalogo.json
      --catalog-version 1 --node-id n1 --data-dir /app/datos/n1 --host 0.0.0.0 --port 8000"
    volumes:
      - ./docs/ejemplos/catalogo-distribuido-v1.json:/app/catalogo.json:ro
      - n1-datos:/app/datos
    # Solo para mirar un nodo por dentro durante la demo; el frontend no lo usa.
    ports:
      - "8011:8000"

  n2:
    <<: *quipudb
    command: >
      sh -c "python -m scripts.preparar_nodo --catalog catalogo.json --catalog-version 1
      --node-id n2 --data-dir /app/datos/n2
      && exec python -m engine.distributed.node_server --catalog catalogo.json
      --catalog-version 1 --node-id n2 --data-dir /app/datos/n2 --host 0.0.0.0 --port 8000"
    volumes:
      - ./docs/ejemplos/catalogo-distribuido-v1.json:/app/catalogo.json:ro
      - n2-datos:/app/datos
    ports:
      - "8012:8000"

  coordinador:
    <<: *quipudb
    # --data-dir guarda el catalogo que cambian CREATE TABLE y DROP TABLE (#296);
    # cada nodo guarda el suyo en su propio volumen.
    command: >
      python -m engine.distributed.coordinator --catalog catalogo.json
      --catalog-version 1 --data-dir /app/datos/coordinador --host 0.0.0.0 --port 8000
    volumes:
      - ./docs/ejemplos/catalogo-distribuido-v1.json:/app/catalogo.json:ro
      - coordinador-datos:/app/datos
    depends_on:
      - n1
      - n2
    ports:
      - "8010:8000"

volumes:
  # Un volumen por nodo: cada uno guarda solo sus fragmentos.
  n1-datos:
  n2-datos:
  coordinador-datos:
